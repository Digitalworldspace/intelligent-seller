<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intelligent Seller</title>
<meta name="description" content="Search once. Intelligent Seller compares India's trusted shopping sites, shows the best product and why, and gives you cashback.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">IS</div>
      <div><b>Intelligent Seller</b><small id="tag"></small></div>
    </div>
    <div class="tools">
      <label class="sr" for="lang" id="langLabel">Language</label>
      <select id="lang"></select>
      <button type="button" class="btn btn-quiet" id="termsBtn" data-act="terms"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 1. Search, as a conversation with the seller -->
  <section class="search-panel">
    <div class="say">
      <div class="av" aria-hidden="true">IS</div>
      <div class="bubble"><h1 id="heroT"></h1><p id="heroS"></p></div>
    </div>
    <form class="bar" id="searchForm" role="search">
      <input id="q" name="q" autocomplete="off" maxlength="100" enterkeyhint="search" aria-label="Search">
      <button type="submit" class="btn btn-primary" id="searchBtn"></button>
    </form>
    <div class="chips"><span id="popular"></span><span id="chips"></span></div>
  </section>

  <!-- 2. Products and results, with the cashback banner standing at the side -->
  <div class="layout">
    <div class="main-col">
      <div id="deals"></div>
      <section id="results" aria-live="polite"></section>
    </div>
    <aside class="side" id="side"></aside>
  </div>

  <footer class="notes" id="notes"></footer>
</main>

<div class="buybar" id="buybar" hidden></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in" id="sheetBody"></div>
</dialog>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
