<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Intelligent Seller</title>
<meta name="description" content="Tell us what you want to buy. The Intelligent Seller compares India's trusted shopping sites, shows you the best product and gives you cashback.">
<meta name="theme-color" content="#16463a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind+Vadodara:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="who">
      <div class="mark" aria-hidden="true">IS</div>
      <div class="who-text"><b>Intelligent Seller</b><small><i class="dot" aria-hidden="true"></i><span id="online"></span></small></div>
    </div>
    <div class="tools">
      <label class="sr" for="lang" id="langLabel">Language</label>
      <select id="lang"></select>
      <button type="button" class="icon-btn" id="infoBtn" aria-label="Trust & terms"></button>
    </div>
  </div>
</header>

<main class="thread" id="thread" aria-live="polite"></main>

<form class="composer" id="composer" role="search">
  <div class="composer-in">
    <div class="chips" id="chips"></div>
    <div class="bar">
      <input id="q" name="q" autocomplete="off" maxlength="100" enterkeyhint="search" aria-label="Search">
      <button type="submit" id="sendBtn" aria-label="Send"></button>
    </div>
  </div>
</form>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in" id="sheetBody"></div>
</dialog>

<script src="config.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
